function log(msg, type = 'normal') {
    const el = document.getElementById('log');
    const className = type === 'success' ? 'success' : type === 'error' ? 'error' : '';
    el.innerHTML += `<span class="${className}">${msg}</span>\n`;
    el.scrollTop = el.scrollHeight;
}

async function getSHA(path) {
    try {
        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
            headers: { 'Authorization': `token ${TOKEN}` }
        });
        if (res.ok) {
            const data = await res.json();
            return data.sha;
        }
    } catch (e) {
        log(`⚠️ getSHA для ${path}: ${e.message}`, 'error');
    }
    return null;
}

async function pushFile(path, b64, sha = null) {
    const payload = {
        message: `feat: ${path} — Jarvis 🤖`,
        content: b64
    };
    if (sha) payload.sha = sha;

    try {
        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${TOKEN}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            log(`✅ ${path} → ${res.status}`, 'success');
            return true;
        } else {
            const err = await res.json();
            log(`❌ ${path} → ${res.status}: ${err.message}`, 'error');
            return false;
        }
    } catch (e) {
        log(`❌ ${path} → ERROR: ${e.message}`, 'error');
        return false;
    }
}

async function startPush() {
    log('🤖 Начинаю пушить файлы на GitHub...\n');
    let success = 0;

    for (let i = 0; i < FILES.length; i++) {
        const f = FILES[i];
        log(`━━━ ${i + 1}/${FILES.length}: ${f.path} ━━━`);

        let sha = null;
        if (f.needSHA) {
            log('  Получаю SHA...');
            sha = await getSHA(f.path);
        }

        if (await pushFile(f.path, f.b64, sha)) {
            success++;
        }
    }

    log(`\n━━━━━━━━━━━━━━━━━━━━━━━━━━━`);
    log(`✅ Done! ${success}/${FILES.length} файлов запушено`, 'success');
}
