name: CI — проверка кода

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Установка зависимостей
        run: npm ci || npm install
      - name: Синтакс-проверка всех модулей
        run: |
          set -e
          echo "Проверяю index.js и все агенты/боты..."
          node --check index.js
          for f in agents/*.js bots/*.js; do
            [ -f "$f" ] && node --check "$f" && echo "ok: $f"
          done
      - name: Проверка JSON-конфигов
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))" && echo "package.json ok"
          node -e "JSON.parse(require('fs').readFileSync('railway.json','utf8'))" && echo "railway.json ok"
