<?xml version="1.0" encoding="UTF-8"?>
<svg width="2400" height="1400" viewBox="0 0 2400 1400" fill="none" xmlns="http://www.w3.org/2000/svg">
<title>LEGAL AUTO — Premium SVG Master Logo</title>
<desc>Premium vector SVG logo for LEGAL AUTO: shield, LA monogram, car silhouette, wordmark and tagline.</desc>

<defs>
  <linearGradient id="gold" x1="280" y1="0" x2="1080" y2="850" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFF5C8"/>
    <stop offset="0.16" stop-color="#C89928"/>
    <stop offset="0.32" stop-color="#8D5A10"/>
    <stop offset="0.50" stop-color="#F5D66C"/>
    <stop offset="0.68" stop-color="#B47A12"/>
    <stop offset="0.84" stop-color="#FFF0A8"/>
    <stop offset="1" stop-color="#9B6A13"/>
  </linearGradient>

  <linearGradient id="silver" x1="0" y1="0" x2="900" y2="320" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="0.22" stop-color="#8E969B"/>
    <stop offset="0.42" stop-color="#F3F5F5"/>
    <stop offset="0.62" stop-color="#687176"/>
    <stop offset="0.78" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#9EA6AA"/>
  </linearGradient>

  <linearGradient id="blackMetal" x1="0" y1="0" x2="900" y2="900" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#0E0E0E"/>
    <stop offset="0.44" stop-color="#222222"/>
    <stop offset="1" stop-color="#030303"/>
  </linearGradient>

  <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
    <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000000" flood-opacity="0.38"/>
  </filter>

  <filter id="metalDepth" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="2" flood-color="#000000" flood-opacity="0.42"/>
    <feDropShadow dx="0" dy="-2" stdDeviation="1.5" flood-color="#FFFFFF" flood-opacity="0.20"/>
  </filter>

  <style>
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .sans { font-family: Montserrat, Arial, Helvetica, sans-serif; }
  </style>
</defs>

<!-- transparent background by default -->

<g id="LEGAL_AUTO_MASTER" transform="translate(0,10)">
  <!-- Shield emblem -->
  <g id="EMBLEM" transform="translate(675,25)" filter="url(#softShadow)">
    <!-- outside black depth -->
    <path d="M525 0
             C660 38 780 38 915 0
             L915 465
             C915 666 635 833 525 900
             C415 833 135 666 135 465
             L135 0
             C270 38 390 38 525 0Z"
          fill="url(#blackMetal)" stroke="#0A0A0A" stroke-width="18" stroke-linejoin="round"/>

    <!-- silver bevel -->
    <path d="M525 22
             C648 56 770 56 889 22
             L889 454
             C889 630 625 784 525 842
             C425 784 161 630 161 454
             L161 22
             C280 56 402 56 525 22Z"
          fill="none" stroke="url(#silver)" stroke-width="16" stroke-linejoin="round"/>

    <!-- gold main bevel -->
    <path d="M525 52
             C632 82 744 82 858 52
             L858 437
             C858 593 614 731 525 784
             C436 731 192 593 192 437
             L192 52
             C306 82 418 82 525 52Z"
          fill="#FFFFFF" stroke="url(#gold)" stroke-width="30" stroke-linejoin="round"/>

    <!-- inner highlight line -->
    <path d="M525 86
             C617 111 722 111 822 86
             L822 423
             C822 556 605 675 525 724
             C445 675 228 556 228 423
             L228 86
             C328 111 433 111 525 86Z"
          fill="none" stroke="#E8E8E8" stroke-width="6" stroke-linejoin="round"/>

    <!-- subtle inner shadow -->
    <path d="M228 86
             C328 111 433 111 525 86
             C617 111 722 111 822 86"
          stroke="#FFFFFF" stroke-width="4" opacity="0.75" stroke-linecap="round"/>

    <!-- LA monogram -->
    <text x="525" y="532" text-anchor="middle"
          class="serif" font-size="410" font-weight="700" letter-spacing="-54"
          fill="url(#gold)" filter="url(#metalDepth)">LA</text>
    <text x="525" y="532" text-anchor="middle"
          class="serif" font-size="410" font-weight="700" letter-spacing="-54"
          fill="none" stroke="#4A2E05" stroke-width="5" opacity="0.58">LA</text>
    <text x="525" y="532" text-anchor="middle"
          class="serif" font-size="410" font-weight="700" letter-spacing="-54"
          fill="none" stroke="#FFF1AD" stroke-width="2" opacity="0.88">LA</text>
  </g>

  <!-- Car silhouette -->
  <g id="CAR_SILHOUETTE" transform="translate(400,875)" filter="url(#softShadow)">
    <path d="M0 132
             C195 38 410 12 675 50
             C845 74 990 130 1196 174"
          stroke="url(#silver)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30 158
             C250 105 455 105 725 127
             C885 140 1012 150 1260 138"
          stroke="url(#gold)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M245 82
             C348 35 485 25 640 45
             C530 76 405 101 245 82Z"
          fill="url(#silver)" opacity="0.78"/>
    <path d="M742 80
             C825 88 900 112 985 145"
          stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
    <path d="M1050 143 C1088 124 1134 123 1184 137"
          stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <g id="WORDMARK" transform="translate(250,1130)">
    <text x="0" y="0"
          class="serif" font-size="165" font-weight="500" letter-spacing="10"
          fill="url(#silver)" filter="url(#metalDepth)">LEGAL</text>
    <text x="900" y="0"
          class="serif" font-size="165" font-weight="500" letter-spacing="10"
          fill="url(#gold)" filter="url(#metalDepth)">AUTO</text>

    <line x1="0" y1="86" x2="150" y2="86" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
    <line x1="1710" y1="86" x2="1860" y2="86" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>

    <text x="930" y="102" text-anchor="middle"
          class="sans" font-size="35" font-weight="500" letter-spacing="9"
          fill="#686868">ВАШ НАДЁЖНЫЙ ПАРТНЁР В МИРЕ АВТОМОБИЛЕЙ</text>
  </g>
</g>
</svg>
